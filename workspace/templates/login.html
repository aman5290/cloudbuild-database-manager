{% extends "base.html" %}

<!--
=============================================================
Project : Pagila PostgreSQL Web Portal

Version : 4.0.0

File    : login.html

Author  : Aman

Purpose
-------
User login page.

Responsibilities
----------------
1. Accept username
2. Accept password
3. Submit login form

Future Scope
------------
- Remember Me
- Forgot Password
- MFA
- Account Lock

Last Updated
------------
04-Aug-2026
=============================================================
-->

{% block title %}
Login
{% endblock %}

{% block content %}

<h2 class="center">

    Sign In

</h2>

{% if message %}

<div class="success-message">

    {{ message }}

</div>

{% endif %}

{% if error %}

<p class="error">

{{ error }}

</p>

{% endif %}

<form method="post" action="/login">

    <label>

        Username

    </label>

    <br><br>

    <input
        type="text"
        name="username"
        required>

    <br><br>

    <label>

        Password

    </label>

    <br><br>

    <input
        type="password"
        name="password"
        required>

    <br><br>

    <button type="submit">

        Login

    </button>

</form>

{% endblock %}
