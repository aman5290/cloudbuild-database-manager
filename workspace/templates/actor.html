<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="UTF-8">
    <title>Actor Details</title>
</head>

<body>
    
    <div class="container">

    <h1>Actor Details</h1>

    {% if actor %}

        <table border="1" cellpadding="8">

        <tr>
            <th>Actor ID</th>
            <th>First Name</th>
            <th>Last Name</th>
        </tr>

        <tr>
            <td>{{ actor[0] }}</td>
            <td>{{ actor[1] }}</td>
            <td>{{ actor[2] }}</td>
        </tr>

        </table>

    {% else %}

        <div class="error">

            <h2>Actor not found.</h2>

            <p>
            No actor exists with the specified Actor ID.
            </p>

        </div>

    {% endif %}

    <br>

    <a href="/">Search Again</a>
    
    </div>

</body>
