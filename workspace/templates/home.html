{% block title %}
Home
{% endblock %}

{% block content %}

<h2 class="center">
    Search Actor
</h2>

<p class="center">
    Enter an Actor ID and click Search.
</p>

<form action="/actor" method="get">

    <label for="actor_id">
        Actor ID
    </label>

    <br><br>

    <input
        type="number"
        id="actor_id"
        name="actor_id"
        required>

    <button type="submit">
        Search
    </button>

</form>

<hr>

<h2 class="center">
    Actor Management
</h2>

<p class="center">
    View every actor stored in PostgreSQL.
</p>

<div class="center">

    <a href="/actors">

        <button>

            View All Actors

        </button>

    </a>

</div>

{% endblock %}
