<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>

        {% block title %}

        {% endblock %}

    <link
        rel="stylesheet"

</head>

<body>

<div class="container">

    <!-- ===============================================

    ================================================ -->

    <h1 class="center">

        Pagila PostgreSQL Web Portal

    <!-- ===============================================
         Page Content
    ================================================ -->

    {% block content %}

    {% endblock %}

    <!-- ===============================================

    ================================================ -->

    <p class="center">

        Version 4.0.0

    </p>
