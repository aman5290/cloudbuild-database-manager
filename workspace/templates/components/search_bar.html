<!-- ==========================================================
     Reusable Search Component
=========================================================== -->

<div class="search-container">

    <h3>

        {{ search_title }}

    </h3>

    <form

        method="GET"

        class="search-form"

    >

        <input

            type="text"

            name="search"

            placeholder="{{ search_placeholder }}"

            value="{{ search }}"

        >

        <button

            class="btn btn-primary"

            type="submit"

        >

            Search

        </button>

        {% if search %}

        <a

            href="{{ request.path }}"

            class="btn btn-secondary"

        >

            Clear

        </a>

        {% endif %}

    </form>

</div>
