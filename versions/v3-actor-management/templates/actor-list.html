<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>All Actors</title>

    <!-- Common CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1 class="center">
        All Actors
    </h1>

    <!-- Display total number of records -->
    <p class="center">
        Total Records :
        <strong>{{ actors|length }}</strong>
    </p>

    {% if actors %}

    <table>

        <thead>

            <tr>
                <th>Actor ID</th>
                <th>First Name</th>
                <th>Last Name</th>
            </tr>

        </thead>

        <tbody>

        <!-- Loop through every actor -->

        {% for actor in actors %}

            <tr>

                <td>{{ actor[0] }}</td>

                <td>{{ actor[1] }}</td>

                <td>{{ actor[2] }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="error">

        <h2>No Actors Found</h2>

        <p>
            The actor table is empty.
        </p>

    </div>

    {% endif %}

    <br>

    <a href="/">
         Back to Home
    </a>

</div>

</body>
